name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  testes:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test -- --ci

      - name: Build de produção
        run: npm run build

  imagem:
    name: Imagem Docker (teste e publicação)
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Monta a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: site-coach:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Testa o container
        run: |
          docker run -d --name site -p 3010:3000 \
            -e ADMIN_EMAIL=ci@teste.local -e ADMIN_PASSWORD=senha-do-ci -e COOKIE_SECURE=false \
            site-coach:teste
          for i in $(seq 1 30); do
            curl -fs http://localhost:3010/robots.txt >/dev/null && break
            sleep 2
          done
          set -x
          curl -fsS http://localhost:3010/ | grep -q 'application/ld+json'
          curl -fsS http://localhost:3010/robots.txt | grep -q 'Disallow: /admin'
          curl -fsS http://localhost:3010/sitemap.xml | grep -q '/cookies</loc>'
          curl -fsS http://localhost:3010/cookies | grep -q 'Política de cookies'
          curl -fsS -o /dev/null http://localhost:3010/og
          curl -fsS http://localhost:3010/admin/login | grep -q 'name="email"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3010/admin)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3010/api/admin/upload)" = "401"
          test "$(docker inspect -f '{{.State.Health.Status}}' site)" != "unhealthy"

      - name: Logs do container
        if: failure()
        run: docker logs site

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publica a imagem testada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha

  deploy:
    name: Deploy
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: producao
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura o acesso SSH
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "${{ vars.DEPLOY_PORT || 22 }}" "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Atualiza o site no servidor
        env:
          DESTINO: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          PORTA: ${{ vars.DEPLOY_PORT || 22 }}
          PASTA: ${{ vars.DEPLOY_PATH || '~/site-coach' }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          SSH="ssh -i ~/.ssh/deploy -p $PORTA $DESTINO"
          $SSH "mkdir -p $PASTA"
          scp -i ~/.ssh/deploy -P "$PORTA" docker-compose.prod.yml "$DESTINO:$PASTA/docker-compose.yml"
          if [ -n "$GHCR_TOKEN" ]; then
            echo "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin"
          fi
          $SSH "cd $PASTA && TAG=${{ github.sha }} docker compose pull && TAG=${{ github.sha }} docker compose up -d && docker image prune -f"

      - name: Confere o site publicado
        if: vars.SITE_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl -fs "${{ vars.SITE_URL }}/robots.txt" >/dev/null && break
            sleep 5
          done
          curl -fsS "${{ vars.SITE_URL }}/" | grep -q 'application/ld+json'
          curl -fsS "${{ vars.SITE_URL }}/sitemap.xml" | grep -q '<loc>'
