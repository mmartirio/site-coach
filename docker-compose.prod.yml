services:
  site:
    image: ghcr.io/mmartirio/site-coach:${TAG:-latest}
    ports:
      - "3010:3000"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SITE_URL: ${SITE_URL:-}
    volumes:
      - site-dados:/app/data
    restart: unless-stopped

volumes:
  site-dados:
